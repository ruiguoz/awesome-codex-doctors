  <title id="title">The Codex Doctor community is accelerating</title>
  <desc id="desc">Cumulative public Codex Doctor projects increased from one in March 2026 to 42 by 2026-08-27. 12 are skills or plugins. 34 projects were created after the official doctor command shipped.</desc>
